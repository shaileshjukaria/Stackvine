    <!-- Google Analytics GA4 -->
    <!-- To activate: set VITE_GA_ID=G-XXXXXXXXXX in client/.env -->
    <script>
      (function() {
        var gaId = '__GA_ID__'; // replaced at build time via index.html template
        if (!gaId || gaId === '__GA_ID__' || gaId === '') return;
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
        document.head.appendChild(script);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', gaId, { anonymize_ip: true });
      })();
    </script>

    <!-- Structured Data (JSON-LD) for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Stackvine",
      "url": "https://stackvine.io",
      "logo": "https://stackvine.io/logo.png",
      "description": "Full stack development studio specialising in web apps, AI integrations, and MVPs.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "email": "hello@stackvine.io",
      "sameAs": [],
      "priceRange": "$$",
      "openingHours": "Mo-Fr 09:00-18:00"
    }
    </script>

    <!-- Preconnect to speed up font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
